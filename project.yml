name: TickKey
options:
  preGenCommand: python3 Scripts/generate_swift_inputs.py
  postGenCommand: bash Scripts/install_pods.sh
  bundleIdPrefix: cn.vanjay
  deploymentTarget:
    iOS: '15.0'
    macOS: '12.0'
  knownRegions: [en, zh-Hans, zh-Hant, Base]
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: X6B6C6U6QV
    MARKETING_VERSION: '1.0.2'
    CURRENT_PROJECT_VERSION: 3
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  MMKV:
    url: https://github.com/Tencent/MMKV.git
    exactVersion: 2.4.2
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    exactVersion: 5.7.1
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 6.29.3
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.0
targets:
  TickKey:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Code Lint
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/Scripts/check_swift.sh"'
        inputFileLists:
          - $(SRCROOT)/Configuration/SwiftLintInputs.xcfilelist
    sources:
      - path: TickKey
        excludes: [Info.plist, Base.lproj/Main.storyboard]
      - path: Shared
    dependencies:
      - package: SnapKit
      - package: GRDB
      - package: MMKV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.vanjay.TickKey
        INFOPLIST_FILE: TickKey/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
    configFiles:
      Debug: Configuration/iOS-Debug.xcconfig
      Release: Configuration/iOS-Release.xcconfig
  TickKeyMac:
    type: application
    productName: TickKey
    platform: macOS
    preBuildScripts:
      - name: Code Lint
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/Scripts/check_swift.sh"'
        inputFileLists:
          - $(SRCROOT)/Configuration/SwiftLintInputs.xcfilelist
    sources: [TickKeyMac, Shared]
    dependencies:
      - package: SnapKit
      - package: GRDB
      - package: MMKV
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: TickKey
        PRODUCT_MODULE_NAME: TickKeyMac
        PRODUCT_BUNDLE_IDENTIFIER: cn.vanjay.TickKey.mac
        INFOPLIST_FILE: Configuration/Mac-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Configuration/Mac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) SPARKLE_ENABLED'
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Configuration/Mac-Debug.entitlements
    configFiles:
      Debug: Configuration/Mac-Debug.xcconfig
      Release: Configuration/Mac-Release.xcconfig
  TickKeyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TickKeyTests, CoreTests]
    dependencies:
      - target: TickKey
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TickKeyMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CoreTests]
    dependencies:
      - target: TickKeyMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/TickKey.app/Contents/MacOS/TickKey'
  TickKeyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TickKeyUITests]
    dependencies:
      - target: TickKey
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TickKey:
    build:
      targets:
        TickKey: all
    test:
      targets: [TickKeyTests, TickKeyUITests]
  TickKeyMac:
    build:
      targets:
        TickKeyMac: all
    test:
      targets: [TickKeyMacTests]
